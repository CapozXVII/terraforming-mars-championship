spring.application.name=terraforming-mars
server.port=8081
server.ssl.enabled=false
server.servlet.context-path=/terraforming-mars
spring.datasource.url=jdbc:h2:mem:terraforming-mars;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE;MODE=POSTGRESQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=terraforming-mars
spring.datasource.password=terraforming-mars
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:debug/schema.sql
